<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{register.title}">สมัครสมาชิก | Calorie Compass</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-intro">
        <div class="language-switch"><a href="?lang=th" th:classappend="${#locale.language == 'th'} ? ' active'">TH</a><span>/</span><a href="?lang=en" th:classappend="${#locale.language == 'en'} ? ' active'">EN</a></div>
        <span class="eyebrow" th:text="#{register.eyebrow}"></span><h1 th:text="#{register.hero}"></h1><p th:text="#{register.intro}"></p>
    </section>
    <section class="card auth-card">
        <h2 th:text="#{register.heading}"></h2><p th:text="#{register.subheading}"></p>
        <form th:action="@{/register}" th:object="${registration}" method="post">
            <label><span th:text="#{register.name}"></span><input type="text" th:field="*{displayName}" autocomplete="name"><em th:errors="*{displayName}"></em></label>
            <label class="full-field"><span th:text="#{register.email}"></span><input type="email" th:field="*{email}" autocomplete="email"><em th:errors="*{email}"></em></label>
            <label class="full-field"><span th:text="#{register.password}"></span><input type="password" th:field="*{password}" autocomplete="new-password"><small class="field-help" th:text="#{register.passwordHelp}"></small><em th:errors="*{password}"></em></label>
            <label class="full-field"><span th:text="#{register.confirm}"></span><input type="password" th:field="*{confirmPassword}" autocomplete="new-password"><em th:errors="*{confirmPassword}"></em></label>
            <button type="submit"><span class="button-label" th:text="#{register.submit}"></span><span>→</span></button>
        </form>
        <p class="auth-link"><span th:text="#{register.hasAccount}"></span> <a th:href="@{/login}" th:text="#{login.submit}"></a></p>
    </section>
</main>
</body>
</html>
