<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{profile.title}">โปรไฟล์ | Calorie Compass</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body>
<main class="page-shell profile-shell">
    <nav th:replace="~{fragments :: nav('profile')}"></nav>
    <header class="page-header"><div><span class="eyebrow" th:text="#{profile.eyebrow}"></span><h1 th:text="#{profile.heading}"></h1><p th:text="#{profile.intro}"></p></div></header>
    <div class="profile-layout">
        <section class="card profile-card">
            <div class="section-heading"><span>01</span><div><h2 th:text="#{profile.account}"></h2><p th:text="#{profile.accountHelp}"></p></div></div>
            <div class="alert success" th:if="${param.saved}" th:text="#{profile.saved}"></div>
            <form th:action="@{/profile}" th:object="${account}" method="post">
                <label><span th:text="#{profile.name}"></span><input type="text" th:field="*{displayName}"><em th:errors="*{displayName}"></em></label>
                <label class="full-field"><span th:text="#{profile.email}"></span><input type="email" th:value="${email}" disabled></label>
                <button type="submit"><span class="button-label" th:text="#{profile.save}"></span><span>→</span></button>
            </form>
        </section>
        <section class="card current-plan-card">
            <div class="section-heading"><span>02</span><div><h2 th:text="#{profile.currentPlan}"></h2><p th:text="#{profile.planHelp}"></p></div></div>
            <div th:if="${latestPlan == null}" class="history-empty" th:text="#{profile.noPlan}"></div>
            <div th:if="${latestPlan != null}" class="plan-details">
                <div><small th:text="#{profile.weight}"></small><b><span th:text="${latestPlan.weightKg}"></span> <span th:text="#{unit.kg}"></span></b></div>
                <div><small th:text="#{profile.calories}"></small><b><span th:text="${latestPlan.calorieTarget}"></span> kcal</b></div>
                <div><small th:text="#{profile.protein}"></small><b><span th:text="${latestPlan.proteinGrams}"></span> <span th:text="#{unit.gram}"></span></b></div>
                <div><small th:text="#{profile.started}"></small><b th:text="${#temporals.format(latestPlan.planDate, 'dd/MM/yyyy')}"></b></div>
            </div>
            <a class="primary-link" th:href="@{/}" th:text="#{profile.adjust}"></a>
        </section>
    </div>
</main>
</body>
</html>
