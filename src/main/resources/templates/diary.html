<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{diary.title}">บันทึกอาหาร | Calorie Compass</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body>
<main class="page-shell">
    <nav th:replace="~{fragments :: nav('diary')}"></nav>
    <header class="diary-header">
        <div><span class="eyebrow" th:text="#{diary.eyebrow}"></span><h1 th:text="#{diary.heading}"></h1><p th:text="#{diary.intro}"></p></div>
        <form class="date-picker" method="get" th:action="@{/diary}"><label><span th:text="#{diary.date}"></span><input type="date" name="date" th:value="${selectedDate}" max="9999-12-31" onchange="this.form.submit()"></label></form>
    </header>

    <div class="alert success undo-alert" th:if="${param.saved}"><span th:text="${savedFoodName != null} ? #{diary.savedNamed(${savedFoodName})} : #{diary.saved}"></span><form th:if="${savedEntryId != null}" th:action="@{/diary/{id}/delete(id=${savedEntryId})}" method="post"><input type="hidden" name="date" th:value="${selectedDate}"><button type="submit" th:text="#{diary.undo}"></button></form></div>
    <div class="alert success" th:if="${param.updated}" th:text="#{diary.updated}"></div>
    <div class="alert" th:if="${param.deleted}" th:text="#{diary.deleted}"></div>
    <div class="alert success" th:if="${param.copied}" th:text="#{diary.copied}"></div>
    <div class="alert" th:if="${param.nothingToCopy}" th:text="#{diary.nothingToCopy}"></div>
    <div class="alert success" th:if="${param.foodCreated}" th:text="#{diary.foodCreated}"></div>
    <div class="alert success" th:if="${param.foodUpdated}" th:text="#{diary.foodUpdated}"></div>
    <div class="alert" th:if="${param.foodDeleted}" th:text="#{diary.foodDeleted}"></div>
    <div class="alert error" th:if="${param.foodInvalid}" th:text="#{diary.foodInvalid}"></div>
    <div class="alert error" th:unless="${summary.hasPlan}" th:text="#{diary.noPlan}"></div>

    <section class="diary-summary" th:classappend="${summary.hasPlan} ? '' : ' no-plan'">
        <article class="summary-main"><small th:text="#{diary.remaining}"></small><strong th:text="${summary.remainingCalories}">0</strong><span>kcal</span><p><b th:text="${summary.consumedCalories}"></b> <span th:text="#{diary.consumed}"></span> <b th:text="${summary.calorieTarget}"></b></p></article>
        <article><small th:text="#{diary.protein}"></small><strong><span th:text="${summary.remainingProtein}"></span> g</strong><p><span th:text="${summary.consumedProtein}"></span> / <span th:text="${summary.proteinTarget}"></span> g</p></article>
        <article><small th:text="#{diary.carbs}"></small><strong><span th:text="${summary.remainingCarbohydrate}"></span> g</strong><p><span th:text="${summary.consumedCarbohydrate}"></span> / <span th:text="${summary.carbohydrateTarget}"></span> g</p></article>
        <article><small th:text="#{diary.fat}"></small><strong><span th:text="${summary.remainingFat}"></span> g</strong><p><span th:text="${summary.consumedFat}"></span> / <span th:text="${summary.fatTarget}"></span> g</p></article>
    </section>
    <section class="meal-overview">
        <article th:each="meal : ${mealSummaries}">
            <span class="meal-label" th:switch="${meal.mealType}"><i th:case="'breakfast'" th:text="#{meal.breakfast}"></i><i th:case="'lunch'" th:text="#{meal.lunch}"></i><i th:case="'dinner'" th:text="#{meal.dinner}"></i><i th:case="*" th:text="#{meal.snack}"></i></span>
            <b><span th:text="${meal.calories}">0</span> kcal</b>
            <small>P <span th:text="${meal.protein}">0</span> · C <span th:text="${meal.carbohydrate}">0</span> · F <span th:text="${meal.fat}">0</span> g</small>
        </article>
    </section>

    <details class="card copy-meal-card collapsible-card">
        <summary class="collapsible-summary"><span>↻</span><div><b th:text="#{diary.copyMeal}"></b><small th:text="#{diary.copyHelp}"></small></div></summary>
        <form class="copy-meal-form" th:action="@{/diary/copy-meal}" method="post">
            <input type="hidden" name="targetDate" th:value="${selectedDate}">
            <label><span th:text="#{diary.sourceDate}"></span><input type="date" name="sourceDate" th:value="${selectedDate.minusDays(1)}" th:max="${selectedDate}" required></label>
            <label><span th:text="#{diary.meal}"></span><select name="mealType"><option value="breakfast" th:text="#{meal.breakfast}"></option><option value="lunch" th:text="#{meal.lunch}"></option><option value="dinner" th:text="#{meal.dinner}"></option><option value="snack" th:text="#{meal.snack}"></option></select></label>
            <button type="submit" th:text="#{diary.copySubmit}"></button>
        </form>
    </details>

    <section class="diary-layout">
        <form class="card food-form" th:action="${editingEntryId == null} ? @{/diary} : @{/diary/{id}(id=${editingEntryId})}" th:object="${foodEntry}" method="post">
            <div class="section-heading"><span th:text="${editingEntryId == null} ? '+' : '✎'">+</span><div>
                <h2 th:if="${editingEntryId != null}" th:text="#{diary.editTitle}"></h2>
                <h2 th:if="${editingEntryId == null and repeatingEntry == null}" th:text="#{diary.addTitle}"></h2>
                <h2 th:if="${repeatingEntry != null}" th:text="#{diary.repeatTitle}"></h2>
                <p th:text="#{diary.formHelp}"></p>
            </div></div>
            <label><span th:text="#{diary.meal}"></span><select th:field="*{mealType}"><option value="breakfast" th:text="#{meal.breakfast}"></option><option value="lunch" th:text="#{meal.lunch}"></option><option value="dinner" th:text="#{meal.dinner}"></option><option value="snack" th:text="#{meal.snack}"></option></select><em th:errors="*{mealType}"></em></label>
            <div class="saved-food-picker">
                <label for="saved-food-search" th:text="#{diary.savedFood}"></label>
                <div class="food-combobox">
                    <input id="saved-food-search" type="search" th:placeholder="#{diary.searchPlaceholder}" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="food-suggestions" aria-expanded="false" th:disabled="${commonFoods.isEmpty() and customFoods.isEmpty()}">
                    <div id="food-suggestions" class="food-suggestions" role="listbox" hidden></div>
                </div>
                <select id="saved-food-select" th:disabled="${commonFoods.isEmpty() and customFoods.isEmpty()}">
                    <option value="" th:text="${commonFoods.isEmpty() and customFoods.isEmpty()} ? #{diary.noSavedFood} : #{diary.chooseSavedFood}"></option>
                    <optgroup th:unless="${commonFoods.isEmpty()}" th:label="#{diary.commonFoods}">
                        <option th:each="food : ${commonFoods}" th:value="${'common-' + food.id}" th:text="${#locale.language == 'en' ? food.nameEn : food.nameTh}" th:attr="data-name=${#locale.language == 'en' ? food.nameEn : food.nameTh},data-entry-name=${#locale.language == 'en' ? food.nameEn : food.nameTh},data-aliases=${food.nameTh + ' ' + food.nameEn},data-brand=${food.category},data-food-key=${'common-' + food.foodCode},data-favorite=${favoriteFoodKeys.contains('common-' + food.foodCode)},data-recent=${recentFoodNames.contains(#locale.language == 'en' ? food.nameEn : food.nameTh)},data-source-type=${food.estimated ? 'estimate' : 'reference'},data-source-label=${food.estimated ? #messages.msg('diary.sourceEstimate') : #messages.msg('diary.sourceReference')},data-source-name=${food.sourceName},data-source-url=${food.sourceUrl},data-unit=${food.baseUnit},data-serving-size=${food.servingSize},data-serving-label=${#locale.language == 'en' ? food.servingLabelEn : food.servingLabelTh},data-calories=${food.caloriesPer100},data-protein=${food.proteinPer100},data-carbs=${food.carbohydratePer100},data-fat=${food.fatPer100}"></option>
                    </optgroup>
                    <optgroup th:unless="${customFoods.isEmpty()}" th:label="#{diary.myFoods}">
                        <option th:each="food : ${customFoods}" th:value="${'custom-' + food.id}" th:text="${food.name + (food.brand.isBlank() ? '' : ' — ' + food.brand)}" th:attr="data-name=${food.name},data-entry-name=${food.name + (food.brand.isBlank() ? '' : ' — ' + food.brand)},data-aliases=${food.name + ' ' + food.brand},data-brand=${food.brand},data-food-key=${'custom-' + food.id},data-favorite=${favoriteFoodKeys.contains('custom-' + food.id)},data-recent=${recentFoodNames.contains(food.name + (food.brand.isBlank() ? '' : ' — ' + food.brand))},data-source-type=custom,data-source-label=#{diary.sourceMine},data-source-name=#{diary.sourceMine},data-source-url='',data-unit=${food.baseUnit},data-serving-size=100,data-serving-label=${food.baseUnit == 'ml' ? '100 ml' : '100 g'},data-calories=${food.caloriesPer100},data-protein=${food.proteinPer100},data-carbs=${food.carbohydratePer100},data-fat=${food.fatPer100}"></option>
                    </optgroup>
                </select>
                <p id="saved-food-note" th:text="#{diary.savedFoodNote}"></p>
                <article id="selected-food-card" class="selected-food-card" hidden>
                    <div class="selected-food-top"><span id="selected-source-badge" class="food-source-badge"></span><button id="favorite-food-button" class="favorite-food-button" type="button" th:aria-label="#{diary.favorite}">☆</button></div>
                    <h3 id="selected-food-name"></h3>
                    <div class="selected-food-stats"><b><span id="selected-calories">0</span> kcal</b><span>P <b id="selected-protein">0</b> g</span><span>C <b id="selected-carbs">0</b> g</span><span>F <b id="selected-fat">0</b> g</span></div>
                    <label class="portion-picker"><span th:text="#{diary.portion}"></span><select id="portion-multiplier"><option value="0.5" th:text="#{diary.halfPortion}"></option><option value="1" selected th:text="#{diary.onePortion}"></option><option value="1.5" th:text="#{diary.oneHalfPortion}"></option><option value="2" th:text="#{diary.twoPortions}"></option></select><small id="selected-serving-label"></small></label>
                    <div id="selected-food-details" class="selected-food-details" hidden><b th:text="#{diary.per100Details}"></b><p id="selected-per100"></p><a id="selected-source-link" target="_blank" rel="noopener"></a></div>
                    <div class="quick-add-actions"><button class="quick-add-button" type="submit" th:text="#{diary.quickAdd}"></button><button id="show-food-details" class="secondary-button detail-toggle" type="button" th:text="#{diary.showDetails}"></button></div>
                </article>
            </div>
            <button id="manual-entry-toggle" class="manual-entry-toggle" type="button" th:if="${editingEntryId == null and repeatingEntry == null}" th:text="#{diary.enterManually}"></button>
            <input type="hidden" th:field="*{logDate}">
            <input type="hidden" th:field="*{servingDescription}"><input type="hidden" th:field="*{dataSource}"><input type="hidden" th:field="*{externalFoodId}">
            <div id="manual-food-fields" class="manual-food-fields" th:hidden="${editingEntryId == null and repeatingEntry == null and !#fields.hasAnyErrors()}">
                <label class="full-field"><span th:text="#{diary.foodName}"></span><input type="text" th:field="*{foodName}"><em th:errors="*{foodName}"></em></label>
                <div class="serving-row">
                <label><span th:text="#{diary.quantity}"></span><input type="number" step="0.01" min="0.01" th:field="*{servingQuantity}"><em th:errors="*{servingQuantity}"></em></label>
                <label><span th:text="#{diary.servingUnit}"></span><select th:field="*{servingUnit}"><option value="g" th:text="#{unit.gram}"></option><option value="ml" th:text="#{unit.ml}"></option></select><em th:errors="*{servingUnit}"></em></label>
                </div>
                <div class="nutrition-inputs">
                <label><span th:text="#{diary.calories}"></span> <small>kcal</small><input type="number" step="0.1" th:field="*{calories}"><em th:errors="*{calories}"></em></label>
                <label><span th:text="#{diary.protein}"></span> <small>g</small><input type="number" step="0.1" th:field="*{proteinGrams}"><em th:errors="*{proteinGrams}"></em></label>
                <label><span th:text="#{diary.carbs}"></span> <small>g</small><input type="number" step="0.1" th:field="*{carbohydrateGrams}"><em th:errors="*{carbohydrateGrams}"></em></label>
                <label><span th:text="#{diary.fat}"></span> <small>g</small><input type="number" step="0.1" th:field="*{fatGrams}"><em th:errors="*{fatGrams}"></em></label>
                </div>
            </div>
            <button id="manual-submit" type="submit" th:hidden="${editingEntryId == null and repeatingEntry == null and !#fields.hasAnyErrors()}"><span class="button-label" th:text="${editingEntryId == null} ? #{diary.saveEntry} : #{diary.saveEdit}"></span><span>→</span></button>
            <a class="cancel-edit" th:if="${editingEntryId != null}" th:href="@{/diary(date=${selectedDate})}" th:text="#{diary.cancelEdit}"></a>
        </form>

        <section class="card entries-card">
            <div class="section-heading"><span>✓</span><div><h2 th:text="#{diary.entries}"></h2><p th:text="${#temporals.format(selectedDate, 'dd/MM/yyyy')}"></p></div></div>
            <div class="meal-entry-group" th:each="meal : ${mealSummaries}">
                <div class="meal-entry-heading"><h3 th:switch="${meal.mealType}"><span th:case="'breakfast'" th:text="#{meal.breakfast}"></span><span th:case="'lunch'" th:text="#{meal.lunch}"></span><span th:case="'dinner'" th:text="#{meal.dinner}"></span><span th:case="*" th:text="#{meal.snack}"></span></h3><b><span th:text="${meal.calories}">0</span> kcal</b></div>
                <div class="meal-empty" th:if="${entriesByMeal.get(meal.mealType) == null or entriesByMeal.get(meal.mealType).isEmpty()}"><span th:text="#{diary.noMealEntries}"></span><button class="add-to-meal" type="button" th:attr="data-meal=${meal.mealType}" th:text="#{diary.addFoodShort}"></button></div>
                <div class="food-entry" th:each="entry : ${entriesByMeal.get(meal.mealType)}">
                    <div class="food-entry-main"><span class="food-origin" th:classappend="${entry.dataSource}" th:text="${entry.dataSource == 'reference'} ? #{diary.sourceReference} : (${entry.dataSource == 'estimate'} ? #{diary.sourceEstimate} : (${entry.dataSource == 'custom'} ? #{diary.sourceMine} : #{diary.sourceManual}))"></span><h3 th:text="${entry.foodName}"></h3><small><span th:text="${#numbers.formatDecimal(entry.servingQuantity, 0, 2)}"></span> <span th:text="${entry.servingUnit == 'ml' ? #messages.msg('unit.ml') : #messages.msg('unit.gram')}"></span><span th:if="${entry.servingDescription != null}" th:text="${' · ' + entry.servingDescription}"></span></small></div>
                    <div class="food-nutrients"><b><span th:text="${#numbers.formatDecimal(entry.calories, 0, 0)}"></span> kcal</b><small>P <span th:text="${#numbers.formatDecimal(entry.proteinGrams, 0, 1)}"></span> · C <span th:text="${#numbers.formatDecimal(entry.carbohydrateGrams, 0, 1)}"></span> · F <span th:text="${#numbers.formatDecimal(entry.fatGrams, 0, 1)}"></span></small></div>
                    <div class="entry-actions"><form th:action="@{/diary/{id}/scale(id=${entry.id})}" method="post"><input type="hidden" name="date" th:value="${selectedDate}"><input type="hidden" name="multiplier" value="0.5"><button class="portion-adjust" type="submit" th:aria-label="#{diary.lessPortion}">−</button></form><form th:action="@{/diary/{id}/scale(id=${entry.id})}" method="post"><input type="hidden" name="date" th:value="${selectedDate}"><input type="hidden" name="multiplier" value="1.5"><button class="portion-adjust" type="submit" th:aria-label="#{diary.morePortion}">+</button></form><a class="secondary-button" th:href="@{/diary/{id}/repeat(id=${entry.id},date=${selectedDate})}" th:text="#{diary.repeat}"></a><a class="edit-button" th:href="@{/diary/{id}/edit(id=${entry.id})}" th:text="#{common.edit}"></a><form th:action="@{/diary/{id}/delete(id=${entry.id})}" method="post"><input type="hidden" name="date" th:value="${selectedDate}"><button class="delete-button" type="submit" th:aria-label="#{common.delete}">×</button></form></div>
                </div>
            </div>
        </section>
        <form id="favorite-toggle-form" th:action="@{/foods/favorites/toggle}" method="post" hidden><input type="hidden" name="foodKey"><input type="hidden" name="date" th:value="${selectedDate}"></form>
    </section>

    <details id="custom-foods" class="card custom-food-card collapsible-card" th:open="${param.foodInvalid != null or param.foodCreated != null or param.foodUpdated != null}">
        <summary class="collapsible-summary"><span>★</span><div><b th:text="#{diary.myFoods}"></b><small th:text="#{diary.myFoodsHelp}"></small></div></summary>
        <div class="custom-food-layout">
            <form th:action="@{/foods/custom}" th:object="${customFood}" method="post">
                <label><span th:text="#{diary.foodName}"></span><input type="text" th:field="*{name}" required></label>
                <label class="full-field"><span th:text="#{diary.brand}"></span> <small th:text="#{common.optional}"></small><input type="text" th:field="*{brand}"></label>
                <label class="full-field"><span th:text="#{diary.per100}"></span><select th:field="*{baseUnit}"><option value="g" th:text="#{unit.gram}"></option><option value="ml" th:text="#{unit.ml}"></option></select></label>
                <div class="nutrition-inputs">
                    <label><span th:text="#{diary.calories}"></span> <small th:text="#{diary.per100short}"></small><input type="number" step="0.1" min="0" th:field="*{caloriesPer100}" required></label>
                    <label><span th:text="#{diary.protein}"></span><input type="number" step="0.1" min="0" th:field="*{proteinPer100}" required></label>
                    <label><span th:text="#{diary.carbs}"></span><input type="number" step="0.1" min="0" th:field="*{carbohydratePer100}" required></label>
                    <label><span th:text="#{diary.fat}"></span><input type="number" step="0.1" min="0" th:field="*{fatPer100}" required></label>
                </div>
                <button type="submit"><span class="button-label" th:text="#{diary.addFood}"></span><span>→</span></button>
            </form>
            <div>
                <label class="food-search"><span th:text="#{diary.searchFood}"></span><input id="custom-food-search" type="search" th:placeholder="#{diary.searchPlaceholder}" autocomplete="off"></label>
                <div class="custom-food-list" id="custom-food-list">
                    <p class="history-empty" th:if="${customFoods.isEmpty()}" th:text="#{diary.noCustomFood}"></p>
                    <p class="search-empty" id="custom-food-search-empty" th:text="#{diary.noSearchResult}"></p>
                    <div class="custom-food-item" th:each="food : ${customFoods}" th:attr="data-search=${food.name + ' ' + food.brand}">
                        <div><b th:text="${food.name}"></b><small><span th:if="${!food.brand.isBlank()}" th:text="${food.brand + ' · '}"></span><span th:text="${#numbers.formatDecimal(food.caloriesPer100, 0, 0) + ' kcal/100 ' + (food.baseUnit == 'ml' ? #messages.msg('unit.ml') : #messages.msg('unit.gram'))}"></span></small><small>P <span th:text="${#numbers.formatDecimal(food.proteinPer100, 0, 1)}"></span> · C <span th:text="${#numbers.formatDecimal(food.carbohydratePer100, 0, 1)}"></span> · F <span th:text="${#numbers.formatDecimal(food.fatPer100, 0, 1)}"></span> g</small></div>
                        <form th:action="@{/foods/custom/{id}/delete(id=${food.id})}" method="post"><button class="delete-button" type="submit" th:aria-label="#{common.delete}">×</button></form>
                        <details class="custom-food-editor"><summary th:text="#{diary.editFood}"></summary>
                            <form th:action="@{/foods/custom/{id}(id=${food.id})}" method="post"><div class="field-grid">
                                <label><span th:text="#{diary.foodName}"></span><input type="text" name="name" th:value="${food.name}" required></label><label><span th:text="#{diary.brand}"></span><input type="text" name="brand" th:value="${food.brand}"></label>
                                <label><span th:text="#{diary.per100}"></span><select name="baseUnit"><option value="g" th:selected="${food.baseUnit == 'g'}" th:text="#{unit.gram}"></option><option value="ml" th:selected="${food.baseUnit == 'ml'}" th:text="#{unit.ml}"></option></select></label>
                                <label><span th:text="#{diary.calories}"></span><input type="number" name="caloriesPer100" step="0.1" min="0" th:value="${food.caloriesPer100}" required></label><label><span th:text="#{diary.protein}"></span><input type="number" name="proteinPer100" step="0.1" min="0" th:value="${food.proteinPer100}" required></label><label><span th:text="#{diary.carbs}"></span><input type="number" name="carbohydratePer100" step="0.1" min="0" th:value="${food.carbohydratePer100}" required></label><label><span th:text="#{diary.fat}"></span><input type="number" name="fatPer100" step="0.1" min="0" th:value="${food.fatPer100}" required></label>
                            </div><button type="submit" th:text="#{common.save}"></button></form>
                        </details>
                    </div>
                </div>
            </div>
        </div>
    </details>
</main>
<script>
    document.documentElement.classList.add('js');
    const isEnglish = document.documentElement.lang === 'en';
    const savedFoodSelect = document.getElementById('saved-food-select');
    const savedFoodSearch = document.getElementById('saved-food-search');
    const savedFoodNote = document.getElementById('saved-food-note');
    const foodSuggestions = document.getElementById('food-suggestions');
    const selectedFoodCard = document.getElementById('selected-food-card');
    const portionMultiplier = document.getElementById('portion-multiplier');
    const manualFoodFields = document.getElementById('manual-food-fields');
    const selectedFoodDetails = document.getElementById('selected-food-details');
    const favoriteFoodButton = document.getElementById('favorite-food-button');
    const favoriteToggleForm = document.getElementById('favorite-toggle-form');
    const manualEntryToggle = document.getElementById('manual-entry-toggle');
    const manualSubmit = document.getElementById('manual-submit');
    const originalOptions = Array.from(savedFoodSelect.options).slice(1);
    const field = name => document.querySelector(`[name="${name}"]`);
    let selectedFood = null;
    let activeSuggestion = -1;
    let manualMode = !manualFoodFields.hidden;

    const normalized = value => value.toLocaleLowerCase().replace(/\s+/g, ' ').trim();
    const relatedSearches = { 'กระเพรา':'กะเพรา', 'ชาเย็น':'ชาไทยเย็น', 'ไข่ทอด':'ไข่ดาว ไข่เจียว', 'หมูย่าง':'คอหมูย่าง', 'ข้าวมัน':'ข้าวมันไก่' };
    const queryVariants = query => [query, relatedSearches[query], query.replaceAll('กระเพรา','กะเพรา')].filter(Boolean);
    const matchScore = (option, query) => {
        const name = normalized(option.dataset.name || '');
        const extra = normalized(`${option.dataset.brand || ''} ${option.dataset.aliases || ''}`);
        return Math.min(...queryVariants(query).map(variant => {
            if (name.startsWith(variant)) return 0;
            if (name.split(' ').some(word => word.startsWith(variant))) return 1;
            if (name.includes(variant)) return 2;
            if (variant.split(' ').some(word => name.includes(word))) return 3;
            if (extra.includes(variant)) return 4;
            return 99;
        }));
    };
    const closeSuggestions = () => {
        foodSuggestions.hidden = true;
        foodSuggestions.replaceChildren();
        savedFoodSearch.setAttribute('aria-expanded', 'false');
        activeSuggestion = -1;
    };
    const chooseFood = option => {
        savedFoodSelect.value = option.value;
        savedFoodSelect.dispatchEvent(new Event('change'));
        savedFoodSearch.value = option.dataset.name;
        closeSuggestions();
    };
    const showSuggestions = () => {
        const query = normalized(savedFoodSearch.value);
        const matches = originalOptions
            .map((option, order) => ({ option, order, score:query ? matchScore(option, query) : (option.dataset.favorite === 'true' ? 0 : option.dataset.recent === 'true' ? 1 : 99) }))
            .filter(match => match.score < 99)
            .sort((a, b) => a.score - b.score || a.order - b.order)
            .slice(0, 8);
        foodSuggestions.replaceChildren(...matches.map(({ option }) => {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'food-suggestion';
            item.setAttribute('role', 'option');
            const factor = Number(option.dataset.servingSize || 100) / 100;
            const marker = option.dataset.favorite === 'true' ? '★' : option.dataset.recent === 'true' ? '↻' : '';
            item.innerHTML = `<span>${escapeHtml(option.dataset.name)} <i>${marker}</i></span><small><em class="food-source-badge ${escapeHtml(option.dataset.sourceType)}">${escapeHtml(option.dataset.sourceLabel)}</em>${escapeHtml(option.dataset.servingLabel)} · ${round(Number(option.dataset.calories) * factor)} kcal</small><small>P ${round(Number(option.dataset.protein) * factor)} · C ${round(Number(option.dataset.carbs) * factor)} · F ${round(Number(option.dataset.fat) * factor)} g</small>`;
            item.addEventListener('mousedown', event => { event.preventDefault(); chooseFood(option); });
            return item;
        }));
        const hasMatches = matches.length > 0;
        foodSuggestions.hidden = !hasMatches;
        savedFoodSearch.setAttribute('aria-expanded', String(hasMatches));
        activeSuggestion = -1;
    };
    savedFoodSearch?.addEventListener('input', () => { selectedFood = null; savedFoodSelect.value = ''; selectedFoodCard.hidden = true; manualFoodFields.hidden = !manualMode; showSuggestions(); });
    savedFoodSearch?.addEventListener('focus', showSuggestions);
    savedFoodSearch?.addEventListener('blur', () => setTimeout(closeSuggestions, 100));
    savedFoodSearch?.addEventListener('keydown', event => {
        const items = Array.from(foodSuggestions.querySelectorAll('.food-suggestion'));
        if (event.key === 'Escape') { closeSuggestions(); return; }
        if (!items.length || !['ArrowDown','ArrowUp','Enter'].includes(event.key)) return;
        event.preventDefault();
        if (event.key === 'Enter') { items[Math.max(0, activeSuggestion)].dispatchEvent(new MouseEvent('mousedown')); return; }
        activeSuggestion = event.key === 'ArrowUp' ? Math.max(0, activeSuggestion - 1) : Math.min(items.length - 1, activeSuggestion + 1);
        items.forEach((item, index) => item.classList.toggle('active', index === activeSuggestion));
        items[activeSuggestion]?.scrollIntoView({ block:'nearest' });
    });
    savedFoodSelect.addEventListener('change', () => {
        const option = savedFoodSelect.selectedOptions[0];
        if (!option?.value) { selectedFood = null; selectedFoodCard.hidden = true; manualFoodFields.hidden = !manualMode; return; }
        selectedFood = { option, unit:option.dataset.unit, servingSize:Number(option.dataset.servingSize || 100), servingLabel:option.dataset.servingLabel, calories:Number(option.dataset.calories), protein:Number(option.dataset.protein), carbs:Number(option.dataset.carbs), fat:Number(option.dataset.fat) };
        field('foodName').value = option.dataset.entryName;
        field('servingQuantity').value = selectedFood.servingSize;
        field('servingUnit').value = selectedFood.unit;
        field('servingDescription').value = selectedFood.servingLabel;
        field('dataSource').value = option.dataset.sourceType;
        field('externalFoodId').value = option.dataset.foodKey;
        portionMultiplier.value = '1';
        updateNutrition(selectedFood.servingSize / 100);
        savedFoodNote.textContent = isEnglish ? `Filled for ${selectedFood.servingLabel}. Change the amount to recalculate automatically.` : `ใส่ข้อมูลสำหรับ ${selectedFood.servingLabel} แล้ว เปลี่ยนจำนวนเพื่อคำนวณสารอาหารอัตโนมัติได้`;
        renderSelectedFood(option);
    });
    function renderSelectedFood(option) {
        manualMode = false;
        selectedFoodCard.hidden = false;
        manualFoodFields.hidden = true;
        manualSubmit.hidden = true;
        document.getElementById('selected-food-name').textContent = option.dataset.name;
        document.getElementById('selected-serving-label').textContent = option.dataset.servingLabel;
        const badge = document.getElementById('selected-source-badge');
        badge.textContent = option.dataset.sourceLabel;
        badge.className = `food-source-badge ${option.dataset.sourceType}`;
        favoriteFoodButton.textContent = option.dataset.favorite === 'true' ? '★' : '☆';
        favoriteFoodButton.classList.toggle('active', option.dataset.favorite === 'true');
        document.getElementById('selected-per100').textContent = `${round(Number(option.dataset.calories))} kcal · P ${round(Number(option.dataset.protein))} · C ${round(Number(option.dataset.carbs))} · F ${round(Number(option.dataset.fat))} g / 100 ${option.dataset.unit}`;
        const sourceLink = document.getElementById('selected-source-link');
        sourceLink.textContent = option.dataset.sourceName || '';
        sourceLink.href = option.dataset.sourceUrl || '#';
        sourceLink.hidden = !option.dataset.sourceUrl;
        updateSelectedStats();
    }
    function updateSelectedStats() {
        if (!selectedFood) return;
        const factor = (selectedFood.servingSize * Number(portionMultiplier.value)) / 100;
        document.getElementById('selected-calories').textContent = round(selectedFood.calories * factor);
        document.getElementById('selected-protein').textContent = round(selectedFood.protein * factor);
        document.getElementById('selected-carbs').textContent = round(selectedFood.carbs * factor);
        document.getElementById('selected-fat').textContent = round(selectedFood.fat * factor);
        field('servingQuantity').value = round(selectedFood.servingSize * Number(portionMultiplier.value));
        field('servingDescription').value = `${portionMultiplier.value} × ${selectedFood.servingLabel}`;
        updateNutrition(factor);
    }
    portionMultiplier.addEventListener('change', updateSelectedStats);
    document.getElementById('show-food-details').addEventListener('click', event => {
        manualFoodFields.hidden = !manualFoodFields.hidden;
        selectedFoodDetails.hidden = manualFoodFields.hidden;
        event.currentTarget.textContent = manualFoodFields.hidden ? (isEnglish ? 'Edit details' : 'แก้รายละเอียด') : (isEnglish ? 'Hide details' : 'ซ่อนรายละเอียด');
    });
    manualEntryToggle?.addEventListener('click', () => {
        manualMode = true;
        selectedFood = null;
        selectedFoodCard.hidden = true;
        manualFoodFields.hidden = false;
        manualSubmit.hidden = false;
        savedFoodSearch.value = '';
        savedFoodSelect.value = '';
        field('dataSource').value = 'manual';
        field('externalFoodId').value = '';
        field('servingDescription').value = '';
        field('foodName').focus();
    });
    document.querySelectorAll('.add-to-meal').forEach(button => button.addEventListener('click', () => {
        field('mealType').value = button.dataset.meal;
        savedFoodSearch.focus();
        savedFoodSearch.scrollIntoView({ behavior:'smooth', block:'center' });
    }));
    favoriteFoodButton.addEventListener('click', async () => {
        if (!selectedFood) return;
        favoriteToggleForm.elements.foodKey.value = selectedFood.option.dataset.foodKey;
        const response = await fetch(favoriteToggleForm.action, { method:'POST', body:new FormData(favoriteToggleForm), headers:{'X-Requested-With':'XMLHttpRequest'} });
        if (response.ok) {
            const isFavorite = selectedFood.option.dataset.favorite !== 'true';
            selectedFood.option.dataset.favorite = String(isFavorite);
            favoriteFoodButton.textContent = isFavorite ? '★' : '☆';
            favoriteFoodButton.classList.toggle('active', isFavorite);
        }
    });
    field('servingQuantity').addEventListener('input', updateFromQuantity);
    field('servingUnit').addEventListener('change', () => {
        if (!selectedFood) return;
        if (field('servingUnit').value === selectedFood.unit) updateFromQuantity();
        else { selectedFood = null; savedFoodSelect.value = ''; savedFoodNote.textContent = isEnglish ? 'The unit differs from the saved food. Enter nutrition for this amount manually.' : 'หน่วยไม่ตรงกับข้อมูลอ้างอิง กรุณากรอกค่าโภชนาการให้ตรงกับปริมาณด้วยตัวเอง'; }
    });
    function updateFromQuantity() { if (selectedFood && field('servingUnit').value === selectedFood.unit) updateNutrition((Number(field('servingQuantity').value) || 0) / 100); }
    function updateNutrition(factor) { field('calories').value=round(selectedFood.calories*factor); field('proteinGrams').value=round(selectedFood.protein*factor); field('carbohydrateGrams').value=round(selectedFood.carbs*factor); field('fatGrams').value=round(selectedFood.fat*factor); }
    function round(value) { return Math.round(value * 10) / 10; }
    function escapeHtml(value) { const element=document.createElement('span'); element.textContent=value; return element.innerHTML; }

    const customFoodSearch = document.getElementById('custom-food-search');
    customFoodSearch?.addEventListener('input', () => {
        const query = customFoodSearch.value.trim().toLocaleLowerCase();
        const items = Array.from(document.querySelectorAll('.custom-food-item'));
        let shown = 0;
        items.forEach(item => { const match = item.dataset.search.toLocaleLowerCase().includes(query); item.hidden = !match; if (match) shown++; });
        document.getElementById('custom-food-search-empty').style.display = items.length > 0 && shown === 0 ? 'block' : 'none';
    });
</script>
</body>
</html>
