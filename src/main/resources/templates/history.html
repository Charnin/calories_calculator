<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{history.title}">ประวัติ | Calorie Compass</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body>
<main class="page-shell">
    <nav th:replace="~{fragments :: nav('history')}"></nav>
    <header class="page-header">
        <div><span class="eyebrow" th:text="#{history.eyebrow}"></span><h1 th:text="#{history.heading}"></h1><p th:text="#{history.intro}"></p></div>
        <div class="period-switch"><a th:classappend="${selectedDays == 7} ? ' active'" th:href="@{/history(days=7)}">7 <span th:text="#{unit.day}"></span></a><a th:classappend="${selectedDays == 30} ? ' active'" th:href="@{/history(days=30)}">30 <span th:text="#{unit.day}"></span></a></div>
    </header>
    <section class="progress-overview">
        <article class="card"><small th:text="#{history.avgCalories}"></small><strong th:text="${report.averageCalories}">0</strong><span th:text="#{history.perDay}"></span></article>
        <article class="card"><small th:text="#{history.avgProtein}"></small><strong th:text="${report.averageProtein}">0</strong><span th:text="#{history.gramsPerDay}"></span></article>
        <article class="card"><small th:text="#{history.loggedDays}"></small><strong th:text="${report.loggedDays}">0</strong><span th:text="${selectedDays + ' ' + #messages.msg('unit.day')}"></span></article>
        <article class="card"><small th:text="#{history.targetDays}"></small><strong th:text="${report.calorieTargetDays}">0</strong><span th:text="#{history.ofDays(${report.loggedDays})}"></span></article>
        <article class="card"><small th:text="#{history.proteinDays}"></small><strong th:text="${report.proteinTargetDays}">0</strong><span th:text="#{history.ofDays(${report.loggedDays})}"></span></article>
    </section>
    <section class="card progress-card">
        <div class="section-heading"><span>↗</span><div><h2 th:text="#{history.daily}"></h2><p th:text="#{history.dailyHelp}"></p></div></div>
        <div class="progress-legend"><span class="calorie-dot"></span> <span th:text="#{history.calories}"></span> <span class="protein-dot"></span> <span th:text="#{history.protein}"></span></div>
        <div class="daily-progress" th:each="day : ${report.days}">
            <div class="progress-date"><b th:text="${#temporals.format(day.date, 'dd/MM')}"></b><small th:text="${day.weightKg == null ? #messages.msg('history.noPlan') : day.weightKg + ' ' + #messages.msg('unit.kg')}"></small></div>
            <div class="progress-bars">
                <div class="bar-row"><span th:text="#{history.energy}"></span><div class="bar-track"><i class="bar-fill calories" th:classappend="${day.overCalories} ? ' over'" th:style="|width:${day.caloriePercent}%|"></i></div><b><span th:text="${day.consumedCalories}"></span>/<span th:text="${day.calorieTarget}"></span></b></div>
                <div class="bar-row"><span th:text="#{history.protein}"></span><div class="bar-track"><i class="bar-fill protein-bar" th:style="|width:${day.proteinPercent}%|"></i></div><b><span th:text="${day.consumedProtein}"></span>/<span th:text="${day.proteinTarget}"></span> g</b></div>
            </div>
        </div>
    </section>
    <section class="card weight-chart-card" th:if="${report.endWeightKg != null}">
        <div class="section-heading"><span>⚖</span><div><h2 th:text="#{history.weightTrend}"></h2><p th:text="#{history.weightHelp}"></p></div></div>
        <div class="weight-chart-scroll"><div class="weight-chart" th:style="|--chart-days:${selectedDays}|"><div class="weight-column" th:each="day : ${report.days}"><b th:text="${day.weightKg == null ? '' : day.weightKg}"></b><div class="weight-track"><i th:if="${day.weightKg != null}" th:style="|height:${report.weightPercent(day.weightKg)}%|"></i></div><small th:text="${#temporals.format(day.date, 'dd/MM')}"></small></div></div></div>
    </section>
</main>
</body>
</html>
